# Publishes the redirect site in site/ to docs.basicswapdex.com. The docs moved
# to https://basicswapdex.com/docs, and every old address here forwards to its
# own page there. The docs as they were before the move are on the legacy branch.

name: Deploy redirects to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: docs.basicswapdex.com
